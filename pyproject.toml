[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-core"
version = "0.1.0"
description = "Ядро домену інтернет-магазину електроніки (ЛР1–ЛР3, варіант 2)"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/shop/legacy/order_pricing.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_legacy_pricing.py",
    "tests/test_legacy_pricing_tdd.py",
]
pytest_add_cli_args = ["-q", "-x", "--tb=no"]
