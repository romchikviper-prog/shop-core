openapi: 3.0.3
info:
  title: Payment Gateway API
  version: 1.0.0
  description: |
    Контракт залежного сервісу «платіжний шлюз» для варіанта 2
    (інтернет-магазин із замовленнями). Операція списання коштів
    ідемпотентна за заголовком `Idempotency-Key`; ключ для замовлення
    має вигляд `order:<uuid>:payment`.
servers:
  - url: http://127.0.0.1:8081
    description: Локальний запуск залежного сервісу
paths:
  /payments:
    post:
      summary: Списати кошти за замовлення
      description: |
        Перший виклик з ключем ідемпотентності створює платіж і повертає
        201. Повторний виклик із тим самим ключем і тими самими даними
        повертає той самий платіж із 200 та `idempotentReplay: true`.
        Повтор із тим самим ключем, але іншими даними — 409.
      operationId: capturePayment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Унікальний ключ операції; для варіанта 2 — номер замовлення.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^order:[0-9a-fA-F-]{36}:payment$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Платіж створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '200':
          description: Повтор уже створеного платежу
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Некоректний запит або відсутній ключ ідемпотентності
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ключ ідемпотентності вже використано з іншими даними
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Тимчасова відмова шлюзу (режим ін'єкції збоїв)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [orderId, amount, currency]
      properties:
        orderId:
          type: string
          format: uuid
          description: Ідентифікатор замовлення.
        amount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          example: '19999.00'
          description: Сума у мінорних одиницях валюти, рядком із двома знаками.
        currency:
          type: string
          enum: [UAH, USD, EUR]
    PaymentResponse:
      type: object
      additionalProperties: false
      required:
        [paymentId, orderId, status, amount, currency, capturedAt, idempotentReplay]
      properties:
        paymentId:
          type: string
          pattern: '^pay-[0-9]{6}$'
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [captured]
        amount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          enum: [UAH, USD, EUR]
        capturedAt:
          type: string
          format: date-time
        idempotentReplay:
          type: boolean
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - idempotency_conflict
                - payment_unavailable
            message:
              type: string
              minLength: 1
